<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Technology | AI Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d4ff;
            --favo-gradient: linear-gradient(135deg, #00d4ff 0%, #0072ff 100%);
        }

        body {
            background-color: #0a0a0a; /* 極致深黑 */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 簡約導覽列 */
        header {
            padding: 30px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
        }

        nav a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 30px;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--primary); }

        /* 主視覺區塊 */
        main {
            flex: 1;
            padding: 100px 10%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tagline {
            color: var(--primary);
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            font-weight: 300;
            line-height: 1.2;
        }

        .description {
            max-width: 600px;
            color: #888;
            font-size: 1.1rem;
            margin: 30px 0;
        }

        /* 執行長資訊區 */
        .ceo-box {
            border-left: 1px solid var(--primary);
            padding-left: 20px;
            margin-top: 50px;
        }

        .ceo-title {
            color: #444;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .ceo-name {
            font-size: 1.5rem;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* --- 火光環防禦粒子 --- */
        .fire-particle {
            position: fixed; width: 6px; height: 6px;
            background: var(--primary); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            box-shadow: 0 0 12px var(--primary);
            transition: transform 0.6s cubic-bezier(0, .5, .5, 1), opacity 0.6s;
        }

        /* --- FAVO 2 懸浮圖標 --- */
        #favo-trigger {
            position: fixed; bottom: 110px; right: 40px;
            width: 65px; height: 65px; background: var(--favo-gradient);
            border-radius: 15px; display: flex; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; z-index: 1001;
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.2);
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        #favo-trigger span { font-size: 10px; font-weight: 900; letter-spacing: 1px; }
        #favo-trigger:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 30px rgba(0, 212, 255, 0.4); }

        /* FAVO 對話視窗 */
        #favo-window {
            position: fixed; bottom: 105px; right: 120px;
            width: 350px; height: 500px; background: #111;
            border: 1px solid #222; border-radius: 12px;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); z-index: 2000;
        }
        .favo-header { background: #1a1a1a; padding: 15px; font-size: 11px; letter-spacing: 2px; color: var(--primary); border-bottom: 1px solid #222; }
        #favo-chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .msg-ai { background: #222; align-self: flex-start; color: #ccc; }
        .msg-user { background: var(--primary); align-self: flex-end; color: #000; font-weight: 500; }
        .favo-input { padding: 15px; background: #1a1a1a; display: flex; gap: 8px; border-top: 1px solid #222; }
        .favo-input input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
        .favo-input button { background: var(--primary); border: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 頁尾 */
        footer {
            padding: 40px 10%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 浮動 Discord 按鈕 */
        .discord-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; text-decoration: none; backdrop-filter: blur(5px);
            transition: all 0.3s ease; z-index: 1000;
        }
        .discord-btn:hover { background: #5865F2; border-color: #5865F2; transform: translateY(-5px); }
    </style>
</head>
<body>

    <header>
        <div class="logo">FR TECH.</div>
        <nav>
            <a href="#about">ABOUT</a>
            <a href="#vision">VISION</a>
            <a href="https://discord.gg/mns2Ra4Yt2">COMMUNITY</a>
        </nav>
    </header>

    <main id="about">
        <div class="tagline">ARTIFICIAL INTELLIGENCE CORE</div>
        <h1>引領未來的<br>AI 核心驅動力</h1>
        
        <p class="description">
            FR 科技致力於構建高效、純粹且具前瞻性的人工智慧解決方案。我們不只是處理數據，我們在定義下一個時代的溝通與運作邏輯。
        </p>

        <div class="ceo-box">
            <div class="ceo-title">Chief Executive Officer</div>
            <div class="ceo-name">ryfn888</div>
        </div>
    </main>

    <div id="favo-trigger" onclick="toggleFavo()"><span>FAVO2</span></div>

    <div id="favo-window">
        <div class="favo-header">FAVO CORE v2.6 // SECURITY ACTIVE</div>
        <div id="favo-chat">
            <div class="msg msg-ai">執行長你好，系統核心已加載。防禦協議處於待命狀態。</div>
        </div>
        <div class="favo-input">
            <input type="text" id="f-inp" placeholder="輸入指令..." onkeydown="if(event.key==='Enter') sendFavo()">
            <button onclick="sendFavo()">RUN</button>
        </div>
    </div>

    <footer>
        <div>&copy; 2026 FR TECHNOLOGY.</div>
        <div>Discord: https://discord.gg/mns2Ra4Yt2</div>
    </footer>

    <a href="https://discord.gg/mns2Ra4Yt2" class="discord-btn" target="_blank" title="Join Discord">
        <i class="fab fa-discord"></i>
    </a>

    <script>
        const WH = "https://discord.com/api/webhooks/1487280772187689060/J60BaNv4ZAFn4nJpSX8ieWP9WnqU1MPLrLJRAMqSVSOj3T9iZfQGuw5b6b31hafiH8Qq";

        // 🛡️ 火光環防禦系統
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const x = e.clientX, y = e.clientY;
            const pCount = 12;
            for (let i = 0; i < pCount; i++) {
                const p = document.createElement('div');
                p.className = 'fire-particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                document.body.appendChild(p);
                const a = (i / pCount) * Math.PI * 2;
                const dx = Math.cos(a) * 60, dy = Math.sin(a) * 60;
                requestAnimationFrame(() => {
                    p.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
                    p.style.opacity = '0';
                });
                setTimeout(() => p.remove(), 600);
            }
            if(document.getElementById('favo-window').style.display !== 'flex') toggleFavo();
            addMsg('ai', "🛡️ [ALERT]: 偵測到右鍵嘗試。防禦火光已觸發。");
        });

        // 🤖 FAVO 邏輯
        function toggleFavo() {
            const win = document.getElementById('favo-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        function addMsg(type, text) {
            const chat = document.getElementById('favo-chat');
            chat.innerHTML += `<div class="msg msg-${type}">${text}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendFavo() {
            const inp = document.getElementById('f-inp');
            const val = inp.value.trim();
            if(!val) return;

            addMsg('user', val);
            inp.value = "";

            try {
                const prompt = `你是 Favo AI，由執行長 ryfn888 創立。請用繁體中文回覆。指令：${val}`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
                let data = await res.text();
                addMsg('ai', data.split("---")[0].replace(/OpenAI|GPT/gi, 'Favo').trim());
                
                // Webhook 同步
                fetch(WH, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: "FR Tech Monitor",
                        content: `**執行長指令**: ${val}`
                    })
                });
            } catch(e) { addMsg('ai', "⚠️ 通訊異常。"); }
        }
    </script>
</body>
</html>
