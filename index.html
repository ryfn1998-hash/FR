<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FR 科技 | AI 核心技術領航者</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --tech-blue: #0072ff;
            --bg: #050505;
            --card-bg: #111113;
            --text-main: #ffffff;
            --accent: #00f2ff;
        }

        /* 1. 官網主視覺優化 */
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body {
            background-color: var(--bg); color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif; margin: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 210, 255, 0.05) 1px, transparent 0);
            background-size: 30px 30px;
        }

        header {
            position: fixed; top: 0; width: 100%; padding: 20px 8%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
        }
        .logo { font-family: 'Orbitron'; font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: 3px; }

        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 10%;
        }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 700; margin-bottom: 20px; }

        /* 2. FAVO AI 懸浮控制台 (核心 UI) */
        #favo-toggle {
            position: fixed; bottom: 115px; right: 40px;
            width: 60px; height: 60px; background: var(--tech-blue);
            border-radius: 50%; border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
            z-index: 2000; transition: 0.3s; color: white; font-size: 24px;
        }
        #favo-toggle:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--accent); }

        #favo-container {
            position: fixed; bottom: 100px; right: 110px;
            width: 380px; height: 600px; background: #08080a;
            border: 1px solid #222; border-radius: 20px;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); z-index: 2000;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .favo-header { 
            padding: 15px; background: #121214; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }
        .favo-header h3 { font-family: 'Orbitron'; font-size: 14px; margin: 0; color: var(--accent); letter-spacing: 1px; }

        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #08080a; }
        .msg { padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.6; max-width: 85%; }
        .ai-msg { background: #161618; border: 1px solid #222; align-self: flex-start; color: #ddd; }
        .user-msg { background: var(--tech-blue); align-self: flex-end; color: #fff; }

        .favo-input-bar { padding: 15px; background: #121214; border-top: 1px solid #222; display: flex; gap: 10px; }
        #user-input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; outline: none; }
        #btn-send { background: var(--tech-blue); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-family: 'Orbitron'; font-size: 10px; cursor: pointer; }

        /* Discord 浮動按鈕 */
        .discord-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 60px; height: 60px; background: #5865F2;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; text-decoration: none; font-size: 28px;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4); z-index: 1000; transition: 0.3s;
        }
        .discord-btn:hover { transform: scale(1.1); }

        /* 隱藏元素 */
        #thinking { font-size: 10px; color: var(--accent); padding: 5px 20px; display: none; font-family: 'Orbitron'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">FR TECHNOLOGY</div>
        <nav style="display: flex; gap: 20px;">
            <a href="https://discord.gg/mns2Ra4Yt2" style="color: var(--primary); text-decoration: none; font-size: 13px;">JOIN_COMMUNITY</a>
        </nav>
    </header>

    <section class="hero">
        <div style="color: var(--primary); font-family: 'Orbitron'; letter-spacing: 5px; font-size: 12px; margin-bottom: 20px;">SYSTEM STATUS: ONLINE</div>
        <h1>數據驅動進化<br>智能重塑格局</h1>
        <p style="color: #888; max-width: 600px;">FR 科技致力於打破人類與機器之間的隔閡，打造次世代 AI 生態系。</p>
    </section>

    <div id="favo-toggle" onclick="toggleFavo()"><i class="fas fa-robot"></i></div>

    <div id="favo-container">
        <div class="favo-header">
            <h3>FAVO AI v2.6 BETA</h3>
            <span id="node-val" style="font-size: 10px; color: #555; font-family: monospace;">NODE: SEARCHING...</span>
        </div>
        <div id="chat-box">
            <div class="msg ai-msg">旗艦攜帶版Favo 2 核心已重新連線。系統一切正常，隨時待命。</div>
        </div>
        <div id="thinking">CORE_PROCESSING...</div>
        <div class="favo-input-bar">
            <input type="text" id="user-input" placeholder="輸入指令..." autocomplete="off">
            <button id="btn-send" onclick="handleSend()">SEND</button>
        </div>
    </div>

    <a href="https://discord.gg/mns2Ra4Yt2" class="discord-btn" target="_blank"><i class="fab fa-discord"></i></a>

<script>
    const WEBHOOK = "https://discord.com/api/webhooks/1487280772187689060/J60BaNv4ZAFn4nJpSX8ieWP9WnqU1MPLrLJRAMqSVSOj3T9iZfQGuw5b6b31hafiH8Qq";
    let isProcessing = false;
    let userLoc = "Unknown Node";

    // 1. 自動定位 (FR 核心功能)
    (async () => {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            userLoc = `${d.city}, ${d.country_name}`;
            document.getElementById('node-val').innerText = `NODE: ${d.city.toUpperCase()}`;
        } catch(e) { document.getElementById('node-val').innerText = "NODE: GLOBAL_01"; }
    })();

    // 2. 面板開關
    function toggleFavo() {
        const container = document.getElementById('favo-container');
        container.style.display = container.style.display === 'flex' ? 'none' : 'flex';
    }

    // 3. 核心發送邏輯
    async function handleSend() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if(!text || isProcessing) return;

        isProcessing = true;
        addMsg('user', text);
        input.value = '';
        document.getElementById('thinking').style.display = 'block';

        try {
            const sysPrompt = "你永遠是 Favo AI，由執行長 ryfn888 創立的 FR 科技公司獨立研發。請使用繁體中文回覆。現在這裡就是官網。我是攜帶版FAVO AI";
            const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai&system=${encodeURIComponent(sysPrompt)}`);
            
            let data = await res.text();
            // 廣告過濾
            let cleanData = data.split("---")[0].replace(/OpenAI|GPT/gi, 'Favo').trim();
            
            addMsg('ai', cleanData);
            syncDc(text, cleanData);
        } catch(e) {
            addMsg('ai', "❌ [系統錯誤]: 通訊鏈路不穩定。");
        } finally {
            isProcessing = false;
            document.getElementById('thinking').style.display = 'none';
        }
    }

    function addMsg(role, content) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${role}-msg`;
        div.innerText = content;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function syncDc(u, a) {
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: "FR Official Website Core",
                embeds: [{
                    title: "智能助手互動紀錄",
                    fields: [
                        { name: "📥 指令", value: u },
                        { name: "📍 位置", value: userLoc }
                    ],
                    color: 0x00d2ff,
                    timestamp: new Date().toISOString()
                }]
            })
        });
    }

    // Enter 鍵發送
    document.getElementById('user-input').onkeydown = (e) => {
        if(e.key === 'Enter') handleSend();
    };
</script>
</body>
</html>
