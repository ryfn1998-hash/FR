<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR 科技 | AI 核心技術領航者</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #3a7bd5;
            --bg: #050505;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.03);
            --favo-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 導覽列 */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 8%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
        }

        .logo {
            font-size: 1.4rem; font-weight: 800; letter-spacing: 3px;
            color: var(--primary); text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; margin-left: 30px; transition: 0.3s; letter-spacing: 1px; }
        nav a:hover { color: var(--primary); }

        /* 英雄區塊 */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 10%;
            background: radial-gradient(circle at 50% 50%, #151515 0%, #050505 100%);
        }

        .hero h1 {
            font-size: clamp(2.8rem, 8vw, 4.5rem); margin: 0; font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2;
        }

        .hero p { font-size: 1.25rem; color: var(--text-dim); max-width: 800px; margin: 30px 0; }

        /* --- 防禦火光粒子 --- */
        .fire-particle {
            position: fixed; width: 8px; height: 8px;
            background: var(--primary); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            box-shadow: 0 0 15px var(--primary), 0 0 5px #fff;
            transition: transform 0.6s cubic-bezier(0, .5, .5, 1), opacity 0.6s;
        }

        /* --- FAVO 2 懸浮按鈕 (漸層文字版) --- */
        #favo-trigger {
            position: fixed; bottom: 120px; right: 40px;
            width: 70px; height: 70px; 
            background: var(--favo-gradient);
            border-radius: 18px; display: flex; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 1001; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #favo-trigger span { font-weight: 900; font-size: 12px; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        #favo-trigger:hover { transform: scale(1.1) translateY(-5px); box-shadow: 0 15px 35px rgba(0, 210, 255, 0.5); }

        /* FAVO 視窗 */
        #favo-window {
            position: fixed; bottom: 115px; right: 125px;
            width: 360px; height: 550px; background: #0c0c0e;
            border: 1px solid #222; border-radius: 20px;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 2000;
            animation: favoFade 0.3s ease-out;
        }
        @keyframes favoFade { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .favo-head { background: #161618; padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .favo-head b { font-size: 12px; color: var(--primary); letter-spacing: 2px; }
        
        #favo-chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0c0c0e; }
        .m { padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 85%; }
        .m-ai { background: #1d1d21; align-self: flex-start; border: 1px solid #333; color: #eee; }
        .m-user { background: var(--accent); align-self: flex-end; color: #fff; }

        .favo-input { padding: 15px; background: #161618; display: flex; gap: 10px; border-top: 1px solid #222; }
        .favo-input input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        .favo-input button { background: var(--primary); border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; color: #000; font-weight: bold; }

        /* 原有區塊樣式維持... (省略重複部分以節省篇幅) */
        .section { padding: 120px 10%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        .card { background: var(--card-bg); padding: 50px 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); transition: 0.4s; }
        .card:hover { border-color: var(--primary); transform: translateY(-15px); }
        .ceo-section { background: linear-gradient(180deg, #050505 0%, #0f0f0f 100%); padding: 120px 10%; display: flex; justify-content: center; }
        .ceo-content { text-align: center; max-width: 800px; padding: 60px; border: 1px solid rgba(0, 210, 255, 0.1); background: var(--glass); border-radius: 4px; }
        
        footer { padding: 80px 10% 40px; background: #000; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
        .discord-btn { position: fixed; bottom: 40px; right: 40px; width: 60px; height: 60px; background: #5865F2; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; text-decoration: none; font-size: 28px; box-shadow: 0 10px 30px rgba(88,101,242,0.4); transition: 0.3s; z-index: 1000; }
        .discord-btn:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>
<body>

    <header>
        <div class="logo">FR TECHNOLOGY</div>
        <nav>
            <a href="#about">企業使命</a>
            <a href="#tech">核心技術</a>
            <a href="#ceo">執行長</a>
        </nav>
    </header>

    <section class="hero" id="about">
        <span>ESTABLISHED 2026</span>
        <h1>數據驅動進化<br>智能重塑格局</h1>
        <p>FR 科技致力於打破人類與機器之間的隔閡。我們協助全球企業實現真正的數位轉型。</p>
        <div style="margin-top: 40px;">
            <a href="#tech" style="padding: 15px 40px; background: var(--primary); color: #000; text-decoration: none; font-weight: bold; border-radius: 2px;">探索技術成果</a>
        </div>
    </section>

    <div id="favo-trigger" onclick="toggleFavo()"><span>FAVO2</span></div>
    
    <div id="favo-window">
        <div class="favo-head">
            <b>FAVO AI CORE v2.6</b>
            <span id="status" style="font-size: 9px; color: #555;">SECURED</span>
        </div>
        <div id="favo-chat">
            <div class="m m-ai">執行長你好，Favo 2 監控系統已就緒。官網防禦機制已啟動。</div>
        </div>
        <div class="favo-input">
            <input type="text" id="f-inp" placeholder="輸入指令..." onkeydown="if(event.key==='Enter') sendFavo()">
            <button onclick="sendFavo()">GO</button>
        </div>
    </div>

    <a href="https://discord.gg/mns2Ra4Yt2" class="discord-btn" target="_blank">
        <i class="fab fa-discord"></i>
    </a>

    <script>
        const WH = "https://discord.com/api/webhooks/1487280772187689060/J60BaNv4ZAFn4nJpSX8ieWP9WnqU1MPLrLJRAMqSVSOj3T9iZfQGuw5b6b31hafiH8Qq";

        // 1. 火光防禦系統
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const x = e.clientX, y = e.clientY;
            const pCount = 12;
            for (let i = 0; i < pCount; i++) {
                const p = document.createElement('div');
                p.className = 'fire-particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                document.body.appendChild(p);
                const angle = (i / pCount) * Math.PI * 2;
                const destX = Math.cos(angle) * 70;
                const destY = Math.sin(angle) * 70;
                requestAnimationFrame(() => {
                    p.style.transform = `translate(${destX}px, ${destY}px) scale(0)`;
                    p.style.opacity = '0';
                });
                setTimeout(() => p.remove(), 600);
            }
            // 連動 Favo 警告
            if(document.getElementById('favo-window').style.display !== 'flex') toggleFavo();
            pushFavoMsg("🛡️ [SECURITY]: 偵測到未授權右鍵行為，防禦火光已觸發。");
        });

        // 2. FAVO 視窗控制
        function toggleFavo() {
            const win = document.getElementById('favo-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        function pushFavoMsg(txt) {
            const chat = document.getElementById('favo-chat');
            chat.innerHTML += `<div class="m m-ai" style="border-left: 3px solid var(--primary);">${txt}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        // 3. FAVO 對話邏輯
        async function sendFavo() {
            const inp = document.getElementById('f-inp');
            const chat = document.getElementById('favo-chat');
            const val = inp.value.trim();
            if(!val) return;

            chat.innerHTML += `<div class="m m-user">${val}</div>`;
            inp.value = ""; chat.scrollTop = chat.scrollHeight;

            try {
                const prompt = `你是 Favo AI，由執行長 ryfn888 創立。請用繁體中文回覆。指令：${val}`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&cache=false`);
                let data = await res.text();
                let cleanData = data.split("---")[0].replace(/OpenAI|GPT/gi, 'Favo').trim();
                
                chat.innerHTML += `<div class="m m-ai">${cleanData}</div>`;
                chat.scrollTop = chat.scrollHeight;

                // 同步至 Discord
                fetch(WH, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: "FR Tech AI Monitor",
                        embeds: [{
                            title: "Favo 2 互動日誌", color: 5814783,
                            fields: [{name: "👤 指令", value: val}, {name: "🤖 回應", value: cleanData.substring(0,500)}],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            } catch(e) {
                pushFavoMsg("⚠️ 通訊鏈路不穩定。");
            }
        }
    </script>
</body>
</html>
