<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR 科技 | AI 核心技術領航者</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --tech-blue: #0072ff;
            --bg: #050505;
            --card-bg: #0c0c0e;
            --text-main: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        /* 質感背景設定 */
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'PingFang TC', sans-serif;
            margin: 0; line-height: 1.8; overflow-x: hidden;
        }

        /* 導覽列優化 */
        header {
            position: fixed; top: 0; width: 100%; padding: 25px 8%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 210, 255, 0.1); z-index: 1000;
        }
        .logo { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--primary); letter-spacing: 4px; }

        /* 英雄區塊：加入動態漸層 */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 10%;
        }
        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.2rem); font-weight: 900;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- FAVO AI 攜帶版懸浮組件 --- */
        #favo-launcher {
            position: fixed; bottom: 120px; right: 40px;
            width: 60px; height: 60px; background: var(--tech-blue);
            border-radius: 50%; border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 114, 255, 0.5);
            transition: 0.4s; z-index: 1001;
        }
        #favo-launcher:hover { transform: scale(1.1) rotate(15deg); }

        #favo-panel {
            position: fixed; bottom: 120px; right: 110px;
            width: 350px; height: 500px; background: #0f0f11;
            border: 1px solid var(--primary); border-radius: 20px;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 1001;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        .favo-header { background: #1a1a1e; padding: 15px; text-align: center; border-bottom: 1px solid #222; }
        .favo-header h3 { font-family: 'Orbitron'; font-size: 14px; margin: 0; color: var(--primary); }
        
        #favo-chat { flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 85%; line-height: 1.5; }
        .ai-msg { background: #1d1d21; align-self: flex-start; border: 1px solid #333; }
        .user-msg { background: var(--tech-blue); align-self: flex-end; color: #fff; }

        .favo-input-area { padding: 15px; background: #0a0a0c; display: flex; gap: 8px; }
        .favo-input-area input { flex: 1; background: #161618; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; outline: none; }
        .favo-input-area button { background: var(--primary); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Discord 浮動（維持原樣但稍微縮小更協調） */
        .discord-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 60px; height: 60px; background: #5865F2;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; text-decoration: none; font-size: 24px;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4); z-index: 1000;
        }

        /* 通用卡片質感 */
        .card {
            background: var(--card-bg); padding: 40px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s;
        }
        .card:hover { border-color: var(--primary); background: rgba(0, 210, 255, 0.02); }

    </style>
</head>
<body>

    <header>
        <div class="logo">FR_TECHNOLOGY</div>
        <nav style="display: flex; gap: 30px; font-size: 0.8rem; letter-spacing: 2px;">
            <a href="#tech" style="color: #888; text-decoration: none;">TECH</a>
            <a href="#ceo" style="color: #888; text-decoration: none;">CEO</a>
            <a href="https://discord.gg/mns2Ra4Yt2" style="color: var(--primary); text-decoration: none;">JOIN_COMMUNITY</a>
        </nav>
    </header>

    <section class="hero">
        <div style="color: var(--primary); font-family: 'Orbitron'; font-size: 0.8rem; margin-bottom: 20px; letter-spacing: 5px;">SYSTEM READY // 2026</div>
        <h1>數據驅動進化<br>智能重塑格局</h1>
        <p style="color: #777; max-width: 600px;">由 ryfn888 領軍，致力於構建具備高度適應性與創造力的 AI 生態系統，重新定義人類與機器的界限。</p>
    </section>

    <div id="favo-launcher" onclick="toggleFavo()" title="召喚 Favo AI">
        <i class="fas fa-robot"></i>
    </div>

    <div id="favo-panel">
        <div class="favo-header">
            <h3>FAVO AI CORE</h3>
        </div>
        <div id="favo-chat">
            <div class="msg ai-msg">旗艦攜帶版Favo 已就緒。請問需要什麼協助？</div>
        </div>
        <div class="favo-input-area">
            <input type="text" id="favo-input" placeholder="輸入指令...">
            <button onclick="favoAsk()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <a href="https://discord.gg/mns2Ra4Yt2" class="discord-btn" target="_blank">
        <i class="fab fa-discord"></i>
    </a>

    <script>
        // 操控 Favo 面板開關
        function toggleFavo() {
            const panel = document.getElementById('favo-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        // 簡單的 AI 對話模擬 (之後可接入你的後端)
        async function favoAsk() {
            const input = document.getElementById('favo-input');
            const chat = document.getElementById('favo-chat');
            const text = input.value.trim();
            if(!text) return;

            // 用戶訊息
            chat.innerHTML += `<div class="msg user-msg">${text}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // 模擬 FR 科技背景回覆
            setTimeout(() => {
                chat.innerHTML += `<div class="msg ai-msg">收到指令。正在連結 FR 科技數據庫處理「${text}」...</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
