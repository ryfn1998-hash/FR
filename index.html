<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR 科技 | AI 核心技術領航者</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #3a7bd5;
            --bg: #050505;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg); color: var(--text-main);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0; line-height: 1.8; overflow-x: hidden;
        }

        /* 導覽列 */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 8%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 3px; color: var(--primary); text-shadow: 0 0 10px rgba(0, 210, 255, 0.3); }
        nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; margin-left: 30px; transition: 0.3s; letter-spacing: 1px; }
        nav a:hover { color: var(--primary); }

        /* 英雄區塊 */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 10%;
            background: radial-gradient(circle at 50% 50%, #151515 0%, #050505 100%);
        }
        .hero h1 {
            font-size: clamp(2.8rem, 8vw, 4.5rem); margin: 0; font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2;
        }

        /* --- FAVO 2 懸浮系統核心 --- */
        #favo-trigger {
            position: fixed; bottom: 120px; right: 40px;
            width: 60px; height: 60px; background: var(--primary);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #000; cursor: pointer; box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            transition: 0.3s; z-index: 1001; font-size: 24px;
        }
        #favo-trigger:hover { transform: scale(1.1) rotate(-10deg); }

        #favo-window {
            position: fixed; bottom: 115px; right: 110px;
            width: 360px; height: 550px; background: #0c0c0e;
            border: 1px solid #222; border-radius: 15px;
            display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 2000;
            animation: favoFade 0.3s ease;
        }
        @keyframes favoFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .favo-head { background: #161618; padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .favo-head span { font-size: 12px; letter-spacing: 2px; color: var(--primary); font-weight: bold; }
        
        #favo-chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0c0c0e; }
        .m { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; line-height: 1.5; }
        .m-ai { background: #1d1d21; align-self: flex-start; border: 1px solid #333; color: #eee; }
        .m-user { background: var(--accent); align-self: flex-end; color: #fff; }

        .favo-input { padding: 15px; background: #161618; display: flex; gap: 10px; border-top: 1px solid #222; }
        .favo-input input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 5px; outline: none; }
        .favo-input button { background: var(--primary); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .favo-input button:hover { opacity: 0.8; }

        /* Discord 浮動 */
        .discord-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 60px; height: 60px; background: #5865F2;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; text-decoration: none; font-size: 28px;
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4); transition: 0.3s; z-index: 1000;
        }
        .discord-btn:hover { transform: scale(1.1); }

        /* 其餘卡片樣式省略，維持原官網設定 */
    </style>
</head>
<body>

    <header>
        <div class="logo">FR TECHNOLOGY</div>
        <nav>
            <a href="#about">使命</a><a href="#tech">技術</a><a href="#ceo">執行長</a>
        </nav>
    </header>

    <section class="hero" id="about">
        <span>ESTABLISHED 2026</span>
        <h1>數據驅動進化<br>智能重塑格局</h1>
        <p>FR 科技致力於打破人類與機器之間的隔閡。協助全球企業實現真正的數位轉型。</p>
    </section>

    <div id="favo-trigger" onclick="toggleFavo()"><i class="fas fa-brain"></i></div>
    
    <div id="favo-window">
        <div class="favo-head">
            <span>FAVO AI CORE v2.6</span>
            <div id="status" style="font-size: 9px; color: #555;">NODE: SYNCING...</div>
        </div>
        <div id="favo-chat">
            <div class="m m-ai">執行長你好，Favo 2 已就緒。系統通訊鏈路正常，隨時準備執行指令。</div>
        </div>
        <div class="favo-input">
            <input type="text" id="f-inp" placeholder="輸入指令..." onkeydown="if(event.key==='Enter') sendFavo()">
            <button onclick="sendFavo()">發送</button>
        </div>
    </div>

    <a href="https://discord.gg/mns2Ra4Yt2" class="discord-btn" target="_blank"><i class="fab fa-discord"></i></a>

    <script>
        const WH = "https://discord.com/api/webhooks/1487280772187689060/J60BaNv4ZAFn4nJpSX8ieWP9WnqU1MPLrLJRAMqSVSOj3T9iZfQGuw5b6b31hafiH8Qq";
        let nodeLoc = "Unknown";

        // 自動獲取節點資訊
        fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{
            nodeLoc = `${d.city}, ${d.country}`;
            document.getElementById('status').innerText = `NODE: ${d.city.toUpperCase()}`;
        });

        function toggleFavo() {
            const win = document.getElementById('favo-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        async function sendFavo() {
            const inp = document.getElementById('f-inp');
            const chat = document.getElementById('favo-chat');
            const val = inp.value.trim();
            if(!val) return;

            // 渲染用戶訊息
            chat.innerHTML += `<div class="m m-user">${val}</div>`;
            inp.value = "";
            chat.scrollTop = chat.scrollHeight;

            try {
                // 調用 Favo 核心引擎
                const prompt = `你是 Favo AI，由執行長 ryfn888 創立。請用繁體中文回覆。指令：${val}`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&cache=false`);
                let data = await res.text();
                
                // 廣告過濾邏輯
                let cleanData = data.split("---")[0].replace(/OpenAI|GPT/gi, 'Favo').trim();
                
                chat.innerHTML += `<div class="m m-ai">${cleanData}</div>`;
                chat.scrollTop = chat.scrollHeight;

                // 同步至 Discord
                fetch(WH, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: "FR Official Website AI",
                        embeds: [{
                            title: "Favo 2 互動日誌",
                            color: 5814783,
                            fields: [
                                {name: "👤 用戶指令", value: val},
                                {name: "🤖 Favo 回應", value: cleanData.substring(0, 1000)},
                                {name: "📍 地點", value: nodeLoc}
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    })
                });
            } catch(e) {
                chat.innerHTML += `<div class="m m-ai">⚠️ [ERROR]: 通訊故障，請檢查鏈路。</div>`;
            }
        }
    </script>
</body>
</html>
